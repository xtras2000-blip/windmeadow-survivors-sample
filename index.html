<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6b79a">
<link rel="icon" href="data:,">
<title>전망순례 · 샘플 플레이</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#f3c7a6;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Gothic A1",system-ui,sans-serif;color:#4a3a63}
#app{position:fixed;inset:0;touch-action:none}
#app canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
#vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 55%,rgba(255,255,255,0) 55%,rgba(120,70,150,.22) 100%)}
#hurt{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;
  background:radial-gradient(ellipse at 50% 50%,rgba(255,80,110,0) 45%,rgba(255,60,100,.55) 100%)}
#hud{position:absolute;inset:0;pointer-events:none;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left))}
.bars{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));width:min(34vw,260px)}
.bar{position:relative;height:15px;border-radius:9px;background:rgba(60,40,90,.55);overflow:hidden;margin-bottom:5px;
  box-shadow:0 1px 4px rgba(80,50,120,.3),inset 0 0 0 1.5px rgba(255,255,255,.5)}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:9px;transition:width .12s}
.bar.hp i{background:linear-gradient(#ff8fa3,#ee4466)}
.bar.xp i{background:linear-gradient(#8defff,#38b6e8);width:0}
.bar span{position:absolute;left:8px;top:0;font-size:10px;line-height:15px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(60,30,90,.6)}
#timer{position:absolute;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);
  padding:5px 16px;border-radius:20px;background:rgba(60,40,90,.55);color:#fff;font-weight:700;font-size:17px;letter-spacing:1px;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.45)}
#btns{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;gap:6px;pointer-events:auto}
#btns button{height:34px;min-width:34px;padding:0 9px;border-radius:17px;border:0;background:rgba(60,40,90,.5);color:#fff;font-size:13px;font-weight:700;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4);font-family:inherit}
#btns button:active{background:rgba(60,40,90,.8)}
#bossbar{position:absolute;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 40px);transform:translateX(-50%);width:min(46vw,380px);display:none}
#bossbar .bar{height:13px}#bossbar .bar i{background:linear-gradient(#ffd27a,#ff9a4a)}
#bossbar small{display:block;text-align:center;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(60,30,90,.7);margin-bottom:2px}
#banner{position:absolute;left:50%;top:26%;transform:translateX(-50%);font-size:clamp(20px,4.6vw,34px);font-weight:900;color:#fff;
  text-shadow:0 2px 8px rgba(120,60,150,.7),0 0 2px rgba(120,60,150,.9);white-space:nowrap;opacity:0;text-align:center}
#banner.show{animation:ban 2.2s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:translateX(-50%) scale(.8)}12%{opacity:1;transform:translateX(-50%) scale(1.05)}25%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
#stick{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;pointer-events:none;
  background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 2.5px rgba(255,255,255,.55),0 0 14px rgba(120,80,170,.25);opacity:0;transition:opacity .15s}
#stick.on{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#fff,#e6d8ff);box-shadow:0 2px 8px rgba(90,50,140,.4)}
#stick.hint{opacity:.55;left:max(80px,calc(env(safe-area-inset-left) + 74px));bottom:90px;top:auto}
.panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  background:rgba(255,226,214,.35);padding:16px}
.panel.hidden{display:none}
.card0{background:rgba(255,255,255,.88);border-radius:22px;padding:22px 26px;box-shadow:0 10px 40px rgba(110,60,150,.35);max-width:min(92vw,460px)}
h1{margin:0;font-size:clamp(28px,7vw,44px);color:#7a4fb8;text-shadow:0 2px 0 #fff}
h2{margin:0;font-size:clamp(22px,5vw,30px);color:#7a4fb8}
.sub{font-size:14px;line-height:1.55;color:#6c5a8a;margin:0}
.big{border:0;border-radius:28px;padding:14px 44px;font-size:21px;font-weight:900;color:#fff;font-family:inherit;
  background:linear-gradient(#ffa06b,#ff6f8f);box-shadow:0 5px 0 #d95a7c,0 10px 24px rgba(220,90,120,.4)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #d95a7c}
.qrow{display:flex;gap:6px;justify-content:center;align-items:center;font-size:13px;flex-wrap:wrap}
.qrow button{border:0;border-radius:14px;padding:6px 12px;font-size:13px;font-weight:700;background:#efe6ff;color:#6b4fa0;font-family:inherit}
.qrow button.sel{background:#8a63d2;color:#fff}
#cardrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;max-width:96vw}
.ucard{width:min(29vw,190px);min-width:132px;background:rgba(255,255,255,.93);border-radius:18px;padding:14px 10px 14px;cursor:pointer;
  box-shadow:0 8px 26px rgba(110,60,150,.35),inset 0 0 0 2px rgba(190,160,240,.7);text-align:center;border:0;font-family:inherit;color:#4a3a63}
.ucard:active{transform:scale(.97)}
.ucard .ic{font-size:34px}.ucard b{display:block;font-size:16px;margin:4px 0 2px;color:#7a4fb8}
.ucard em{display:block;font-style:normal;font-size:11px;font-weight:700;color:#e0577a;margin-bottom:5px}
.ucard span{display:block;font-size:12px;line-height:1.45;color:#6c5a8a}
.stat{display:flex;gap:18px;justify-content:center;font-size:14px;color:#6c5a8a}.stat b{display:block;font-size:22px;color:#7a4fb8}
#rot{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:6px 14px;border-radius:16px;background:rgba(60,40,90,.6);color:#fff;font-size:12px;display:none;white-space:nowrap}
#fatal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#fbe4d6;padding:24px;text-align:center;font-size:15px}
</style>
</head>
<body>
<div id="app">
  <canvas id="fx"></canvas>
  <div id="vig"></div><div id="hurt"></div>
  <div id="hud">
    <div class="bars">
      <div class="bar hp"><i id="hpFill"></i><span id="hpTxt">HP</span></div>
      <div class="bar xp"><i id="xpFill"></i><span id="lvTxt">Lv 1</span></div>
    </div>
    <div id="timer">05:00</div>
    <div id="btns">
      <button id="bQ" title="풀 밀도">🌿 보통</button>
      <button id="bView" title="시점">📐 시점</button>
      <button id="bSnd">🔊</button>
      <button id="bFs">⛶</button>
      <button id="bPause">⏸</button>
    </div>
    <div id="bossbar"><small>황혼 젤리</small><div class="bar"><i id="bossFill"></i></div></div>
    <div id="banner"></div>
  </div>
  <div id="stick"><div id="knob"></div></div>
  <div id="rot">📱 가로로 돌리면 풍경이 더 넓게 보여요</div>

  <div id="menu" class="panel">
    <div class="card0">
      <h1>전망순례</h1>
      <p class="sub" style="margin:4px 0 12px">샘플 플레이 · 5분 버티기</p>
      <p class="sub">한 손으로 <b>이동</b>만 하세요.<br>공격은 <b>자동</b>이에요.<br>레벨업마다 카드를 한 장 고르면 더 강해져요.</p>
      <div class="qrow" style="margin:14px 0 4px"><span>풀 밀도</span>
        <button data-q="0">높음</button><button data-q="1">보통</button><button data-q="2">낮음</button></div>
      <p class="sub" style="font-size:12px;opacity:.8">폰이 버벅이면 <b>낮음</b>을 골라 보세요</p>
    </div>
    <button class="big" id="bStart">시작하기</button>
    <p class="sub" style="font-size:12px">이동: 화면 아무 곳이나 터치하고 끌기 · PC는 WASD / 방향키</p>
  </div>

  <div id="cards" class="panel hidden">
    <h2 style="color:#fff;text-shadow:0 2px 8px rgba(120,60,150,.7)">레벨 업! ✨ 하나를 고르세요</h2>
    <div id="cardrow"></div>
  </div>

  <div id="pause" class="panel hidden">
    <div class="card0"><h2>잠깐 쉬는 중</h2><p class="sub" style="margin:8px 0 0">풍경을 구경해도 좋아요 🌅</p></div>
    <button class="big" id="bResume">계속하기</button>
  </div>

  <div id="over" class="panel hidden">
    <div class="card0">
      <h2 id="overTitle">쓰러졌어요</h2>
      <p class="sub" id="overSub" style="margin:6px 0 14px"></p>
      <div class="stat"><div><b id="sTime">0:00</b>생존</div><div><b id="sLv">1</b>레벨</div><div><b id="sKill">0</b>처치</div></div>
    </div>
    <button class="big" id="bRestart">다시 하기</button>
  </div>
</div>
<div id="fatal"></div>
<script type="module" src="./game.js"></script>
</body>
</html>
